<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Você me ama?</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            background-color: #ffc8dd;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden; /* Impede barras de rolagem indesejadas na tela principal */
        }

        h1 {
            color: #590d22;
            font-size: 2rem;
            text-align: center;
            margin-bottom: 40px;
            padding: 0 20px;
        }

        /* Área onde os botões ficam lado a lado inicialmente */
        .botoes-container {
            display: flex;
            gap: 20px;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 100%;
            height: 80px;
        }

        button {
            background-color: #ffb3c1;
            border: 2px solid #590d22;
            padding: 12px 24px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #590d22;
            border-radius: 10px;
            cursor: pointer;
        }

        /* Botão SIM fica normal no flexbox */
        #sim {
            z-index: 10;
        }

        /* Botão NÃO começa no fluxo, mas ganha position absolute quando foge */
        #nao {
            transition: all 0.1s ease-in-out;
        }
    </style>
</head>
<body>

    <h1>Você me ama?</h1>

    <div class="botoes-container" id="container">
        <button id="sim" onclick="aceito()">Sim</button>
        <button id="nao" onmouseover="fugir()" ontouchstart="fugir()">Não</button>
    </div>

    <script>
        function fugir() {
            const btnNao = document.getElementById('nao');
            
            // Transforma em absolute para poder mover livremente pela tela na primeira fuga
            if (btnNao.style.position !== 'absolute') {
                btnNao.style.position = 'absolute';
            }

            // Pega as dimensões da janela e do botão
            const larguraJanela = window.innerWidth;
            const alturaJanela = window.innerHeight;
            
            const larguraBtn = btnNao.offsetWidth;
            const alturaBtn = btnNao.offsetHeight;

            // Calcula posições aleatórias garantindo uma margem de segurança de 20px das bordas
            const maxX = larguraJanela - larguraBtn - 20;
            const maxY = alturaJanela - alturaBtn - 20;
            
            const randomX = Math.max(20, Math.floor(Math.random() * maxX));
            const randomY = Math.max(120, Math.floor(Math.random() * (maxY - 50))); // Evita colar no topo (onde está o título)

            // Aplica a nova posição garantindo que ele NUNCA saia da tela
            btnNao.style.left = randomX + 'px';
            btnNao.style.top = randomY + 'px';
        }

        function aceito() {
            alert("Eu te amo meu amor, lanchinho mais tarde? ❤️");
        }
    </script>
</body>
</html>
