<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Você me ama?</title>
    <style>
        body {
            background-color: #ffc8dd;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Montserrat', sans-serif;
        }
        h1 {
            color: #590d22;
            font-size: 2rem;
            text-align: center;
            margin-bottom: 30px;
        }
        .buttons {
            position: relative;
            width: 100%;
            height: 150px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }
        button {
            background-color: #ffb3c1;
            border: 2px solid #590d22;
            padding: 10px 20px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #590d22;
            border-radius: 10px;
            cursor: pointer;
        }
        #nao {
            position: absolute;
        }
    </style>
</head>
<body>

    <h1>Você me ama?</h1>
    <div class="buttons">
        <button id="sim" onclick="aceito()">Sim</button>
        <button id="nao" onmouseover="fugir()" ontouchstart="fugir()">Não</button>
    </div>

    <script>
        function fugir() {
            const btnNao = document.getElementById('nao');
            const larguraMax = window.innerWidth - btnNao.offsetWidth - 50;
            const alturaMax = window.innerHeight - btnNao.offsetHeight - 50;
            
            const randomX = Math.random() * larguraMax;
            const randomY = Math.random() * alturaMax;
            
            btnNao.style.left = randomX + 'px';
            btnNao.style.top = randomY + 'px';
        }

        function aceito() {
            alert("Eu te amo meu amor, lanchinho mais tarde?");
        }
    </script>
</body>
</html>
