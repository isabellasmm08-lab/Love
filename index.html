<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Você me ama?</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            background-color: #ffc8dd;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        h1 {
            color: #590d22;
            font-size: 2rem;
            text-align: center;
            margin-bottom: 40px;
            padding: 0 20px;
        }

        /* Caixa que segura os botões lado a lado perfeitamente */
        .botoes {
            display: flex;
            gap: 20px;
            align-items: center;
            justify-content: center;
        }

        button {
            background-color: #ffb3c1;
            border: 2px solid #590d22;
            padding: 12px 24px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #590d22;
            border-radius: 10px;
            cursor: pointer;
            z-index: 10;
        }
    </style>
</head>
<body>

    <h1>Você me ama?</h1>

    <div class="botoes">
        <button id="sim" onclick="aceito()">Sim</button>
        <button id="nao" onmouseover="fugir()" ontouchstart="fugir()">Não</button>
    </div>

    <script>
        function fugir() {
            const btnNao = document.getElementById('nao');
            
            // Pega o tamanho total da tela visível
            const maxX = window.innerWidth - 120;
            const maxY = window.innerHeight - 100;
            
            // Gera posições estritamente dentro da tela (com margem de segurança)
            const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.floor(Math.random() * maxY);
            
            // Transforma em absolute apenas na primeira fuga para soltar da linha
            btnNao.style.position = 'fixed';
            btnNao.style.left = Math.max(20, randomX) + 'px';
            btnNao.style.top = Math.max(100, randomY) + 'px';
        }

        function aceito() {
            alert("Eu te amo gatinho ❤️");
        }
    </script>
</body>
</html>
